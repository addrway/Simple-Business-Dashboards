<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login - SBD</title><link rel='stylesheet' href='assets/css/styles.css'><script src='assets/js/shared.js'></script></head><body>
<div class='auth-wrap'><div class='card form-card'><h2>Welcome back</h2><p class='small'>Log in to access your dashboard.</p><form id='loginForm'><div class='field'><label>Email</label><input class='input' id='email' type='email' required></div><div class='field'><label>Password</label><input class='input' type='password' required></div><button class='btn btn-primary' type='submit'>Login</button></form><p class='small'>No account? <a href='signup.html'>Create one</a>.</p></div></div>
<script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();SBD.login(document.getElementById('email').value);location.href='dashboard.html';});</script>
</body></html>
