<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sign Up - SBD</title><link rel='stylesheet' href='assets/css/styles.css'><script src='assets/js/shared.js'></script></head><body>
<div class='auth-wrap'><div class='card form-card'><h2>Create your SBD account</h2><form id='signupForm'><div class='field'><label>Business Name</label><input class='input' id='business' required></div><div class='field'><label>Email</label><input class='input' id='email' type='email' required></div><div class='field'><label>Password</label><input class='input' type='password' required></div><button class='btn btn-primary' type='submit'>Create Account</button></form></div></div>
<script>document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem(SBD.storageKeys.business,document.getElementById('business').value);SBD.login(document.getElementById('email').value);location.href='dashboard.html';});</script>
</body></html>
