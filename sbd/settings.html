<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Settings - SBD</title><link rel='stylesheet' href='assets/css/styles.css'><script src='assets/js/shared.js'></script></head><body><section class='section'><div class='container'><h2>Settings</h2><div class='grid grid-3'><div class='card'><h3>Profile</h3><p id='email'>Email: demo@sbd.com</p><div class='field'><label>Business Name</label><input class='input' id='bizName'></div><button id='saveBiz' class='btn btn-primary'>Save</button></div><div class='card'><h3>Plan</h3><p>Current Plan: <strong id='planName'>Free</strong></p><p class='small'>Upgrade from Pricing page anytime.</p></div><div class='card'><h3>Data Controls</h3><button id='resetData' class='btn btn-outline'>Reset all demo data</button><p class='small'>This clears dashboard data and profile.</p></div></div><div class='card' style='margin-top:16px'><h3>Future Integrations</h3><p>Coming soon: Supabase sync, Stripe billing, Vercel deployment workflow, POS connectors.</p></div></div></section>
<script>const u=SBD.getUser();if(u)document.getElementById('email').textContent='Email: '+u.email;document.getElementById('bizName').value=localStorage.getItem(SBD.storageKeys.business)||'';document.getElementById('saveBiz').onclick=()=>{localStorage.setItem(SBD.storageKeys.business,document.getElementById('bizName').value);alert('Saved');};document.getElementById('resetData').onclick=()=>{localStorage.removeItem(SBD.storageKeys.data);localStorage.removeItem(SBD.storageKeys.user);localStorage.removeItem(SBD.storageKeys.business);alert('Data reset complete');};</script></body></html>
