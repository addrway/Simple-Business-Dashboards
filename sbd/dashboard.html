<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Dashboard - SBD</title><link rel='stylesheet' href='assets/css/styles.css'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><script src='assets/js/shared.js'></script><script src='assets/js/dashboard.js'></script></head><body>
<nav class='navbar'><div class='container nav-wrap'><a class='brand' href='index.html'>SBD</a><div class='nav-links'><a href='templates.html'>Templates</a><a href='pricing.html'>Pricing</a><a href='settings.html'>Settings</a></div></div></nav>
<main class='container dashboard-main'><p id='authNotice' class='notice'></p><div class='dash-grid'><section class='card'><h3>Enter Business Data</h3><form id='manualForm'><div class='field'><label>Date</label><input id='date' class='input' type='date' required></div><div class='field'><label>Category</label><input id='category' class='input' placeholder='Sales channel' required></div><div class='field'><label>Revenue</label><input id='revenue' class='input' type='number' min='0' step='0.01' required></div><div class='field'><label>Expense</label><input id='expense' class='input' type='number' min='0' step='0.01' required></div><button class='btn btn-primary' type='submit'>Add Row</button></form><hr><div class='field'><label>Upload CSV (date,category,revenue,expense)</label><input id='csvInput' class='input' type='file' accept='.csv,text/csv'></div><button id='resetBtn' class='btn btn-outline'>Clear All Data</button></section>
<section class='card'><h3>Business KPI Overview</h3><div class='kpis'><div class='kpi'><div class='label'>Total Revenue</div><div id='kpiRevenue' class='value'>$0</div></div><div class='kpi'><div class='label'>Total Expense</div><div id='kpiExpense' class='value'>$0</div></div><div class='kpi'><div class='label'>Total Profit</div><div id='kpiProfit' class='value'>$0</div></div></div><p class='small'>Profit Margin: <strong id='kpiMargin'>0%</strong></p><div style='height:240px'><canvas id='revenueChart'></canvas></div><div style='height:240px;margin-top:16px'><canvas id='profitChart'></canvas></div></section></div>
<section class='card' style='margin-top:18px'><h3>Data Table</h3><div class='table-wrap'><table><thead><tr><th>Date</th><th>Category</th><th>Revenue</th><th>Expense</th><th>Profit</th></tr></thead><tbody id='dataBody'></tbody></table></div></section></main>
</body></html>
