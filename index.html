<!DOCTYPE html>
<html>
<head>
  <title>SBD - Simple Business Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
      text-align:center;
      padding:80px;
    }

    h1{
      font-size:48px;
    }

    p{
      font-size:20px;
      color:#94a3b8;
    }

    .card{
      background:#1e293b;
      padding:30px;
      border-radius:10px;
      margin:20px;
      display:inline-block;
      width:200px;
    }
  </style>
</head>

<body>

<h1>SBD</h1>
<p>Simple Business Dashboard</p>

<div class="card">
<h2>$45,000</h2>
<p>Revenue</p>
</div>

<div class="card">
<h2>320</h2>
<p>Orders</p>
</div>

<div class="card">
<h2>$12,000</h2>
<p>Profit</p>
</div>

<div class="card">
<h2>6%</h2>
<p>Growth</p>
</div>

<p>Coming Soon: Data Visualization Dashboards</p>

</body>
</html>
